name: companion_app
description: A companion app for real-time power plant sensor monitoring.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  flutter_riverpod: ^2.4.9
  http: ^1.1.0
  fl_chart: ^0.65.0
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
