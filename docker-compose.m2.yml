services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhel_fastapi
    env_file: .env
    ports:
      - "0.0.0.0:${API_PORT}:8000"
    restart: unless-stopped
    volumes:
      - api_logs:/var/log/bhel
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, httpx; port=os.getenv('API_PORT'); r=httpx.get(f'http://0.0.0.0:{port}/health', timeout=5); assert r.status_code == 200\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: bhel_redis
    env_file: .env
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
      then redis-server --appendonly yes --bind 0.0.0.0 --requirepass "$$REDIS_PASSWORD";
      else redis-server --appendonly yes --bind 0.0.0.0;
      fi'
    ports:
      - "0.0.0.0:${REDIS_PORT}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -h 0.0.0.0 -p 6379 -a \"$$REDIS_PASSWORD\" ping; else redis-cli -h 0.0.0.0 -p 6379 ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  api_logs:
    name: bhel_api_logs
  redis_data:
    name: bhel_redis_data

networks:
  bhel_net:
    name: bhel_net
    driver: bridge
