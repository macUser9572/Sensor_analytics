services:
  react-dashboard:
    image: node:20-alpine
    container_name: bhel_react_dashboard
    working_dir: /workspace/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    env_file: .env
    environment:
      REACT_API_BASE_URL: ${REACT_API_BASE_URL}
      REACT_WS_URL: ${REACT_WS_URL}
    ports:
      - "0.0.0.0:3000:3000"
    restart: unless-stopped
    volumes:
      - ./frontend:/workspace/frontend
      - react_node_modules:/workspace/frontend/node_modules
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://0.0.0.0:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  react_node_modules:
    name: bhel_react_node_modules

networks:
  bhel_net:
    name: bhel_net
    driver: bridge
