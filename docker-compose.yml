services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhel_fastapi
    env_file: .env
    ports:
      - "0.0.0.0:${API_PORT}:8000"
    restart: unless-stopped
    volumes:
      - api_logs:/var/log/bhel
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, httpx; port=os.getenv('API_PORT'); r=httpx.get(f'http://0.0.0.0:{port}/health', timeout=5); assert r.status_code == 200\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: bhel_redis
    env_file: .env
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
      then redis-server --appendonly yes --bind 0.0.0.0 --requirepass "$$REDIS_PASSWORD" --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 60;
      else redis-server --appendonly yes --bind 0.0.0.0 --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 60;
      fi'
    ports:
      - "0.0.0.0:${REDIS_PORT}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -h 0.0.0.0 -p 6379 -a \"$$REDIS_PASSWORD\" ping; else redis-cli -h 0.0.0.0 -p 6379 ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: bhel_timescaledb
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "0.0.0.0:${DB_PORT}:5432"
    restart: unless-stopped
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 0.0.0.0 -p 5432 -U \"$${DB_USER}\" -d \"$${DB_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: bhel_minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --address "0.0.0.0:9000" --console-address "0.0.0.0:9001"
    ports:
      - "0.0.0.0:${MINIO_PORT}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT}:9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "mc alias set bhel http://0.0.0.0:9000 \"$${MINIO_ACCESS_KEY}\" \"$${MINIO_SECRET_KEY}\" >/dev/null 2>&1 && mc ready bhel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  api_logs:
    name: bhel_api_logs
  redis_data:
    name: bhel_redis_data
  timescaledb_data:
    name: bhel_timescaledb_data
  minio_data:
    name: bhel_minio_data

networks:
  bhel_net:
    name: bhel_net
    driver: bridge
