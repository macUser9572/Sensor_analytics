services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: bhel_timescaledb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: [ "postgres", "-c", "max_connections=500" ]
    ports:
      - "0.0.0.0:${DB_PORT}:5432"
    restart: unless-stopped
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bhel_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 0.0.0.0 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: bhel_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --address "0.0.0.0:9000" --console-address "0.0.0.0:9001"
    ports:
      - "0.0.0.0:${MINIO_PORT}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT}:9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data
    networks:
      - bhel_net
    healthcheck:
      test: [ "CMD-SHELL", "mc alias set bhel http://0.0.0.0:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null 2>&1 && mc ready bhel" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  timescaledb_data:
    name: bhel_timescaledb_data
  minio_data:
    name: bhel_minio_data

networks:
  bhel_net:
    name: bhel_net
    driver: bridge
