services:
  opcua-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhel_opcua_server
    command: python -m app.opcua_bridge
    env_file: .env
    ports:
      - "0.0.0.0:${OPC_PORT}:${OPC_PORT}"
    restart: unless-stopped
    volumes:
      - opcua_server_logs:/var/log/bhel
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('OPC_PORT', '4840'))), timeout=5); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  opcua_server_logs:
    name: bhel_opcua_server_logs

networks:
  bhel_net:
    name: bhel_net
    driver: bridge
