services:
  opcua-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhel_opcua_server
    command: python main.py
    env_file: .env
    ports:
      - "0.0.0.0:${OPC_PORT}:${OPC_PORT}"
      - "0.0.0.0:8001:${API_PORT}"
    restart: unless-stopped
    volumes:
      - opcua_server_logs:/var/log/bhel
    networks:
      - bhel_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, httpx; port=os.getenv('API_PORT'); r=httpx.get(f'http://0.0.0.0:{port}/opcua/nodes', timeout=5); assert r.status_code == 200 and len(r.json()) == 500\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  opcua_server_logs:
    name: bhel_opcua_server_logs

networks:
  bhel_net:
    name: bhel_net
    driver: bridge
